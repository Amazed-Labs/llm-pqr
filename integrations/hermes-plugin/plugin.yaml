# Independently maintained by Amazed Labs. This is not an official
# Nous Research router and is not part of Hermes Agent core.
name: llm-pqr
version: 0.1.0
description: >
  Opt-in policy routing that consumes LLM-PQR before a Hermes provider
  call. Rewrites the selected model, and always writes provider/base_url
  for a local candidate. Missing config is a no-op. Broken config and
  unexpected routing errors skip the hosted call. Not an official Nous
  Research router.
author: Amazed Labs
license: MIT
homepage: https://github.com/Amazed-Labs/llm-pqr
manifest_version: 2
api_version: 1
tags:
  - routing
  - policy
  - model-selection
python_dependencies:
  - "llm-pqr>=0.3.1,<0.4"
